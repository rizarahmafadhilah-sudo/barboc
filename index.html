<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damaged & Repack Monitoring FG</title>
    
    <meta name="theme-color" content="#1B365D">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(30, 58, 138, 0.3) 0%, transparent 40%),
                linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 2px, transparent 0, transparent 50px);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif; 
            color: #334155; 
            min-height: 100vh;
        }
        .card-box { 
            background: #ffffff; 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.3); 
        }
        .btn-custom { 
            background-color: #1B365D; 
            border-color: #1B365D; 
            color: #ffffff; 
            font-weight: 600; 
            padding: 12px; 
            border-radius: 12px; 
            transition: all 0.3s;
        }
        .btn-custom:hover { 
            background-color: #11223F; 
            color: #ffffff; 
            transform: translateY(-1px);
        }
        .form-control, .form-select { 
            padding: 10px 14px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            font-size: 0.9rem; 
        }
        .form-control:focus, .form-select:focus {
            border-color: #1B365D;
            box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.15);
        }
        .option-btn { 
            border: 1px solid #cbd5e1; 
            background-color: #ffffff; 
            color: #334155; 
            font-weight: 600; 
            padding: 10px; 
            border-radius: 12px; 
            transition: all 0.2s ease; 
            font-size: 0.9rem;
        }
        .option-btn.active { 
            background-color: #1B365D; 
            border-color: #1B365D; 
            color: #ffffff; 
        }
        .company-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 50%;
            background: #f8fafc;
            padding: 8px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        footer {
            color: #94a3b8 !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between p-3 p-md-4">
    <div class="container my-auto" style="max-width: 520px;">
        
        <!-- HALAMAN 1: LOGIN NIK -->
        <div id="loginSection" class="card-box p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10" alt="Logo PT" class="company-logo mb-3">
                <h3 class="fw-bold text-dark">Monitoring FG</h3>
                <p class="text-muted small">Silakan masukkan NIK Anda untuk melanjutkan</p>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">NIK Karyawan <span class="text-danger">*</span></label>
                <input type="text" id="loginNik" class="form-control" placeholder="Contoh: 214006291" onkeypress="if(event.key === 'Enter') handleLogin();">
            </div>
            <div id="loginAlert" class="alert py-2 small text-center d-none mb-3"></div>
            <button type="button" onclick="handleLogin()" class="btn btn-custom w-100 shadow-sm" id="loginBtn"> MASUK </button>
        </div>

        <!-- HALAMAN 2: FORM UTAMA TRANSAKSI -->
        <div id="formSection" class="card-box p-4 p-md-5 d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="backToLogin()">
                    <i class="fa-solid fa-arrow-left me-1"></i> Ganti NIK
                </button>
                <span id="displayNik" class="badge bg-light text-dark border px-3 py-2 small"></span>
            </div>
            
            <div class="text-center mb-4">
                <h4 class="fw-bold text-dark mb-1">Form Input Barang</h4>
                <p id="welcomeUserText" class="text-primary fw-semibold small mb-1">Halo, -</p>
            </div>

            <form id="transactionForm" onsubmit="submitTransaction(event)">
                <!-- Pilih Kategori Input -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary d-block">Tipe Input <span class="text-danger">*</span></label>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn option-btn w-100 active" id="btnBocor" onclick="selectType('BOCOR')">
                                <i class="fa-solid fa-box-tissue me-1"></i> Barang Bocor
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn option-btn w-100" id="btnRepack" onclick="selectType('REPACK')">
                                <i class="fa-solid fa-boxes-packing me-1"></i> Hasil Repack
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Input Tanggal -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Tanggal <span class="text-danger">*</span></label>
                    <input type="date" id="tanggalVal" class="form-control" required>
                </div>

                <!-- Input No Pallet -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">No. Pallet <span class="text-danger">*</span></label>
                    <input type="text" id="noPalletVal" class="form-control" required placeholder="Contoh: PLT-001">
                </div>

                <!-- Input MID -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">MID <span class="text-danger">*</span></label>
                    <input type="text" id="midVal" class="form-control" required placeholder="Contoh: MID123456">
                </div>

                <!-- Input Deskripsi -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Deskripsi Barang <span class="text-danger">*</span></label>
                    <textarea id="deskripsiVal" class="form-control" rows="2" required placeholder="Masukkan deskripsi barang"></textarea>
                </div>

                <!-- Input QTY & UOM -->
                <div class="row g-2 mb-3">
                    <div class="col-7">
                        <label class="form-label small fw-semibold text-secondary">QTY <span class="text-danger">*</span></label>
                        <input type="number" id="qtyVal" class="form-control" min="1" step="any" required placeholder="0">
                    </div>
                    <div class="col-5">
                        <label class="form-label small fw-semibold text-secondary">UOM <span class="text-danger">*</span></label>
                        <select id="uomVal" class="form-select" required>
                            <option value="" selected disabled>Pilih...</option>
                            <option value="PCS">PCS</option>
                            <option value="BOX">BOX</option>
                            <option value="CTN">CTN</option>
                            <option value="KG">KG</option>
                            <option value="LTR">LTR</option>
                        </select>
                    </div>
                </div>

                <!-- Input Reason -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Reason / Alasan <span class="text-danger">*</span></label>
                    <input type="text" id="reasonVal" class="form-control" required placeholder="Contoh: Kemasan Pecah / Bocor">
                </div>

                <div id="formAlert" class="alert py-2 small text-center d-none mb-3"></div>
                <button type="submit" id="submitBtn" class="btn btn-custom w-100 shadow-sm"> SIMPAN DATA </button>
            </form>
        </div>
    </div>

    <footer class="text-center small mt-4">
        &copy; 2026 by Non FG Support
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4SDziwJNwZjW9038YcEwGZ-klnIpOO6C7ZBEdIWd59HQCCk2zPchd3rijAqkEkWCPHA/exec"; 
        let currentNik = "";
        let currentNama = "";
        let selectedType = "BOCOR"; 

        // Set default tanggal hari ini
        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tanggalVal').value = today;
        });

        async function handleLogin() {
            const nikInput = document.getElementById('loginNik').value.trim();
            const alertBox = document.getElementById('loginAlert');
            const loginBtn = document.getElementById('loginBtn');

            if (!nikInput) {
                alertBox.className = "alert alert-danger py-2 small text-center mb-3";
                alertBox.innerText = "Silakan masukkan NIK terlebih dahulu!";
                alertBox.classList.remove('d-none');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Memeriksa NIK...";
            alertBox.classList.add('d-none');

            try {
                const response = await fetch(`${WEB_APP_URL}?action=getNama&nik=${nikInput}`);
                const data = await response.json();
                
                currentNik = nikInput;
                currentNama = data.nama || "Karyawan";

                document.getElementById('displayNik').innerText = "NIK: " + currentNik;
                document.getElementById('welcomeUserText').innerText = "Halo, " + currentNama;

                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('formSection').classList.remove('d-none');
            } catch (err) {
                console.error(err);
                currentNik = nikInput;
                currentNama = "Karyawan " + currentNik;
                document.getElementById('displayNik').innerText = "NIK: " + currentNik;
                document.getElementById('welcomeUserText').innerText = "Halo, " + currentNama;

                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('formSection').classList.remove('d-none');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "MASUK";
            }
        }

        function backToLogin() {
            document.getElementById('formSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('loginNik').value = "";
            document.getElementById('loginAlert').classList.add('d-none');
            document.getElementById('formAlert').classList.add('d-none');
            resetForm();
        }

        function selectType(type) {
            selectedType = type;
            document.getElementById('btnBocor').classList.remove('active');
            document.getElementById('btnRepack').classList.remove('active');
            
            if (type === 'BOCOR') {
                document.getElementById('btnBocor').classList.add('active');
            } else {
                document.getElementById('btnRepack').classList.add('active');
            }
        }

        function resetForm() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tanggalVal').value = today;
            document.getElementById('noPalletVal').value = "";
            document.getElementById('midVal').value = "";
            document.getElementById('deskripsiVal').value = "";
            document.getElementById('qtyVal').value = "";
            document.getElementById('uomVal').value = "";
            document.getElementById('reasonVal').value = "";
        }

        async function submitTransaction(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('formAlert');
            btn.disabled = true;
            btn.innerText = "Mengirim...";
            alertBox.classList.add('d-none');

            const payload = {
                type: selectedType, // "BOCOR" atau "REPACK"
                tanggal: document.getElementById('tanggalVal').value,
                noPallet: document.getElementById('noPalletVal').value.trim(),
                mid: document.getElementById('midVal').value.trim(),
                deskripsi: document.getElementById('deskripsiVal').value.trim(),
                qty: document.getElementById('qtyVal').value,
                uom: document.getElementById('uomVal').value,
                reason: document.getElementById('reasonVal').value.trim(),
                pic: currentNama + " (" + currentNik + ")"
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                alertBox.className = "alert alert-success py-2 small text-center mb-3";
                alertBox.innerText = `Data berhasil disimpan ke sheet ${selectedType === 'BOCOR' ? 'Input Barang Bocor' : 'Input Hasil Repack'}!`;
                alertBox.classList.remove('d-none');

                resetForm();
            } catch (err) {
                console.error(err);
                alertBox.className = "alert alert-danger py-2 small text-center mb-3";
                alertBox.innerText = "Gagal mengirim data.";
                alertBox.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.innerText = "SIMPAN DATA";
            }
        }
    </script>
</body>
</html>
